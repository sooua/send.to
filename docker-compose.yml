version: "3.8"

services:
  sendto:
    build: .
    container_name: sendto
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - sendto-data:/tmp/send.to
    environment:
      - PROVIDER=local
      - BASEDIR=/tmp/send.to
      - LISTENER=:8080
      - PURGE_DAYS=7
      - MAX_UPLOAD_SIZE=0
      # - CORS_DOMAINS=https://yourdomain.com
      # - RATE_LIMIT=10
      # - HTTP_AUTH_USER=admin
      # - HTTP_AUTH_PASS=secret

volumes:
  sendto-data:
